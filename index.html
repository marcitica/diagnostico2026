<!doctype html>
<html lang="es-CR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación diagnóstica de Desarrollo Web – CTP Cañas</title>
<style>
:root{font:16px system-ui;color:#142b35;background:#f1f6f6;--teal:#08665e;--line:#c7d6d5}*{box-sizing:border-box}body{margin:0}header{background:#102e38;color:white;padding:1.1rem max(1rem,calc((100vw - 76rem)/2));display:flex;justify-content:space-between;align-items:center;gap:1rem}header strong{font-size:1.08rem}main{max-width:78rem;margin:auto;padding:clamp(1rem,3vw,2.5rem)}h1{line-height:1.1;font-size:clamp(1.85rem,4vw,3rem);margin:.25em 0}h2{margin-top:0}p{line-height:1.5}.sub{color:#42616a}.label{font-size:.88rem;font-weight:700;color:var(--teal);letter-spacing:.03em}.card{background:white;border:1px solid var(--line);border-radius:1rem;padding:clamp(1rem,3vw,1.6rem);margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:1rem}.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.75rem 0}button,.button{font:inherit;font-weight:650;padding:.6rem .9rem;border:1px solid var(--teal);border-radius:.55rem;color:var(--teal);background:white;cursor:pointer;text-decoration:none;display:inline-block}.primary,[aria-current=true]{background:var(--teal);color:white}button:disabled{opacity:.5;cursor:default}input,select,textarea{font:inherit;padding:.55rem .65rem;border:1px solid #809b9b;border-radius:.45rem;background:white;color:inherit;width:100%}textarea{min-height:6rem}label{display:block;font-weight:600;margin:.55rem 0}label :is(input,select,textarea){margin-top:.3rem}input:is([type=radio],[type=checkbox]){width:auto;margin-right:.5em}.choice{border:1px solid var(--line);border-radius:.5rem;padding:.65rem;white-space:pre-wrap;overflow-wrap:anywhere}.source{width:100%;height:60vh;border:1px solid var(--line);border-radius:.5rem}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);text-align:left;padding:.6rem;vertical-align:top}th{background:#e7f3f2}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.notice{background:#fff5d8;color:#603b0b;padding:.7rem;border-radius:.5rem}.error{color:#99272c;font-weight:700}.small{font-size:.9rem}dialog{max-width:min(64rem,95vw);max-height:90vh;border:1px solid var(--line);border-radius:1rem}dialog::backdrop{background:#102e3890}progress{width:min(30rem,100%);accent-color:var(--teal)}img{max-width:100%}@media print{header,nav,.no-print,dialog{display:none!important}main{padding:0}.card{border:0;padding:0}.scroll{overflow:visible}body{background:white}button{border:0;color:black!important;background:white!important;padding:0}}
.objective-bar{display:grid;grid-template-columns:minmax(12rem,2fr) minmax(6rem,1fr) auto;align-items:center;gap:.65rem;margin:.45rem 0}.objective-bar button{text-align:left}.objective-bar meter{width:100%;height:1.25rem;accent-color:var(--teal)}tfoot{font-weight:bold}@media(max-width:650px){.objective-bar{grid-template-columns:1fr auto}.objective-bar button{grid-column:1/-1}}@media print{.objective-bar button{color:black}.objective-bar meter{print-color-adjust:exact}}
.exam-cover{text-align:center;padding:clamp(1.6rem,5vw,3.4rem) clamp(1rem,4vw,2.6rem);border-top:4px solid var(--teal)}
.exam-cover .label{margin:0 0 .65rem}.exam-cover h1{max-width:22ch;margin:.2em auto .8em;text-wrap:balance}
.exam-details{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;list-style:none;margin:0;padding:0}
.exam-details li{border:1px solid var(--line);border-radius:999px;padding:.45rem .85rem;background:#f1f6f6;color:#234752;font-weight:650}
</style>
<header><strong>CTP Cañas · Desarrollo Web</strong><button hidden id="out">Cerrar sesión</button></header>
<main><div id="notice" role="status"></div><div id="view"></div></main><dialog id="modal"></dialog>
<script>
const $=id=>document.getElementById(id), view=$('view'), modal=$('modal');
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(label,key,value='',type='text')=>`<label>${h(label)}<input type="${type}" name="${key}" value="${h(value)}" required></label>`;
const select=(label,key,options,value='')=>`<label>${h(label)}<select name="${key}">${options.map(o=>`<option ${o===value?'selected':''}>${h(o)}</option>`).join('')}</select></label>`;
const ta=(label,key,value='')=>`<label>${h(label)}<textarea name="${key}">${h(value)}</textarea></label>`;
const fd=f=>Object.fromEntries(new FormData(f));
const btn=(text,action,primary=false)=>`<button type="button" class="${primary?'primary':''}" data-action="${action}">${h(text)}</button>`;
let T,S,tab='Preparar',exam='',save=Promise.resolve(),draft,position=0,verify=false,timer;
function say(msg='',err=false){$('notice').innerHTML=msg?`<p class="${err?'error':'notice'}">${h(msg)}</p>`:''}
async function api(path,data){
 const r=await fetch('/api/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const x=await r.json();if(!r.ok)throw Error(x.error);if(x.deadline!=null)x.clockSample=performance.now();return x
}
function guard(fn){return async (...a)=>{try{await fn(...a)}catch(e){say(e.message,true)}}}
function form(id,fn){$(id).onsubmit=guard(async e=>{e.preventDefault();await fn(fd(e.currentTarget),e.currentTarget)})}
function binder(actions,scope=view){scope.querySelectorAll('[data-action]').forEach(b=>b.onclick=guard(()=>actions[b.dataset.action]?.(b)))}
function examCover(title,count,duration){
 const hours=Math.floor(duration/60), minutes=duration%60;
 const time=duration===null?'':duration>0?[hours?hours+(hours===1?' hora':' horas'):'',minutes?minutes+(minutes===1?' minuto':' minutos'):''].filter(Boolean).join(' '):'Sin límite de tiempo';
 return `<section class="card exam-cover" aria-labelledby="exam-title"><p class="label">CTP Cañas · Especialidad técnica</p><h1 id="exam-title">${h(title)}</h1><ul class="exam-details" aria-label="Detalles de la evaluación"><li>${h(count)} preguntas</li>${time?`<li>${h(time)}</li>`:''}<li>Selección única</li></ul></section>`
}
function login(){
 view.innerHTML=`${examCover('Evaluación diagnóstica de Desarrollo Web',60,180)}<div class="grid"><form id="student" class="card"><h2>Ingreso de estudiantes</h2>${field('Identificación escolar','id')}${field('Clave individual','pin','','password')}<button class="primary">Continuar</button></form><form id="teacher" class="card"><h2>Ingreso docente</h2>${field('Clave docente','password','','password')}<button class="primary">Ingresar</button></form></div>`;
 for(const role of ['student','teacher'])form(role,async p=>{await api('login',{...p,role});say();await boot()})
}
async function boot(){
 clearInterval(timer); const m=await api('me');$('out').hidden=!m.role;
 if(m.role==='teacher'){await load();return}if(m.role==='student'){S=await api('student');renderStudent();return}login()
}
$('out').onclick=guard(async()=>{await save.catch(()=>{});await api('logout',{});position=0;verify=false;say();await boot()});
async function load(){T=await api('teacher');draft=null;renderTeacher()}
const src=q=>`${T.sources[q.file].name} · ${q.year}${q.mode?' · '+q.mode:''} · página PDF ${q.page} · ítem ${q.num}`;
function renderTeacher(){
 view.innerHTML=`<p class="label">Área docente</p><h1>Evaluación diagnóstica de Desarrollo Web</h1><nav class="bar no-print" aria-label="Área docente">${['Banco','Secciones','Preparar','Aplicación','Resultados'].map(x=>`<button data-action="tab" data-tab="${x}" aria-current="${tab===x}">${x}</button>`).join('')}</nav><div id="panel"></div>`;
 binder({tab:b=>{tab=b.dataset.tab;say();renderTeacher()}});
 ({Banco:bank,Secciones:sections,Preparar:prepare,Aplicación:applications,Resultados:results})[tab]();
}
function bank(){
 $('panel').innerHTML=`<div class="card"><h2>Importación de fuentes</h2><div class="scroll"><table><thead><tr><th>Archivo</th><th>Páginas</th><th>Detectados</th><th>Disponibles</th><th>Pendientes</th></tr></thead><tbody>${T.sources.map((s,i)=>{const qs=T.bank.filter(q=>q.file===i),a=qs.filter(q=>q.approved).length;return `<tr><td><a href="/fuente/${i}" target="_blank" rel="noopener">${h(s.name)}</a></td><td>${s.pages}</td><td>${i===0?'Referencia':qs.length}</td><td>${i===0?'—':a}</td><td>${i===0?'—':qs.length-a}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><h2>Banco de preguntas</h2><label>Buscar por número, año, modalidad o texto<input id="search" placeholder="2026 22"></label><div id="list"></div></div><div class="grid"><form class="card" id="missingItem"><h2>Registrar ítem faltante</h2><label>Examen<select name="file">${T.sources.map((s,i)=>i?`<option value="${i}">${h(s.name)}</option>`:'').join('')}</select></label>${field('Número original','num','','number')}${field('Página del PDF','page','','number')}<button>Registrar para revisión</button></form><form class="card" id="curriculum"><h2>Fuentes curriculares adicionales</h2><ul>${T.curriculum.map(c=>`<li><a href="/fuente/${c.ref}" target="_blank" rel="noopener">${h(c.name)}</a></li>`).join('')}</ul>${field('Nombre de la fuente','name')}<label>Documento PDF<input id="curriculumPdf" type="file" accept="application/pdf" required></label><button>Guardar fuente</button></form></div>`;
 const render=()=>{const words=$('search').value.toLowerCase().trim().split(/\s+/);const qs=T.bank.filter(q=>words.every(w=>[q.year,q.num,q.mode,q.stem,q.topic,q.indicator,q.tags].join(' ').toLowerCase().includes(w))); $('list').innerHTML=`<p>${qs.length} ítems</p><div class="scroll"><table><thead><tr><th>Procedencia</th><th>Pregunta</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${h(src(q))}</td><td>${h(q.stem.slice(0,170))}</td><td>${q.approved?'Aprobado':'Pendiente'}</td><td><button data-action="review" data-id="${q.id}">Revisar</button></td></tr>`).join('')}</tbody></table></div>`;binder({review:b=>review(T.bank.find(q=>q.id===b.dataset.id))},$('list'))};
 form('missingItem',async p=>{await api('new-question',p);await load();review(T.bank.find(q=>q.id===p.file+'-'+p.num))});
 form('curriculum',async p=>{const file=$('curriculumPdf').files[0];if(file.size>3000000)throw Error('Seleccioná un PDF de hasta 3 MB.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await api('curriculum',{name:p.name,pdf:data.split(',')[1]});say('Fuente curricular guardada.');await load()});
 $('search').oninput=render;render()
}
function show(content){modal.innerHTML=content+'<div class="bar"><button id="close">Cerrar</button></div>';if(!modal.open)modal.showModal();$('close').onclick=()=>modal.close()}
function review(q){
 show(`<h2>Revisar ítem ${q.num} · ${q.year}</h2><p>${h(src(q))}</p><div class="grid"><div><p><a href="/fuente/${q.file}#page=${q.page}" target="_blank" rel="noopener">Abrir página original</a> · <a href="/fuente/0#page=5" target="_blank" rel="noopener">Tabla 2025</a></p><iframe class="source" title="Página original del examen" src="/fuente/${q.file}#page=${q.page}"></iframe><p class="notice">${h(q.flags.join(' · '))}</p><details id="pageTranscript"><summary>Transcripción automática de la página</summary><pre class="pre" id="pageText"></pre></details></div><form id="review">${ta('Enunciado','stem',q.stem)}${'ABCD'.split('').map(k=>ta('Opción '+k,k,q.options[k])).join('')}${select('Clave','key',['','A','B','C','D'],q.key)}${select('Tipo de clave','keytype',['Propuesta','Oficial'],q.keytype)}${ta('Fuente oficial de la clave, si corresponde','keysource',q.keysource)}${ta('Justificación y evidencia','why',q.why)}${select('Nivel curricular','level',['','Décimo','Undécimo','Duodécimo'],q.level)}${ta('Subárea','area',q.area)}${ta('Objetivo evaluado','result',q.result)}${ta('Indicador principal','indicator',q.indicator)}${ta('Tema específico','topic',q.topic)}${ta('Temas secundarios','tags',q.tags)}${ta('Fuente del vínculo curricular','origin',q.origin)}<label>Recurso visual recortado para el estudiante<input type="file" id="visual" accept="image/png,image/jpeg,image/webp"></label><label><input type="checkbox" name="approved" ${q.approved?'checked':''}>Aprobar para evaluaciones</label><button class="primary">Guardar revisión</button><p id="reviewError" role="alert"></p></form></div>`);
 $('pageTranscript').ontoggle=async e=>{if(e.currentTarget.open&&!$('pageText').textContent){try{const x=await api('transcript?file='+q.file+'&page='+q.page);$('pageText').textContent=x.text||'Página sin texto recuperado.'}catch(error){$('pageText').textContent=error.message}}};
 $('review').onsubmit=async e=>{e.preventDefault();try{const p=fd(e.currentTarget),file=$('visual').files[0];p.visual=q.visual||'';if(file){if(file.size>2000000)throw Error('Usá una imagen de hasta 2 MB.');p.visual=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}p.options=Object.fromEntries('ABCD'.split('').filter(k=>p[k]?.trim()).map(k=>[k,p[k].trim()])); await api('question',{...p,id:q.id,approved:!!p.approved});modal.close();say('Revisión guardada.');await load()}catch(error){$('reviewError').textContent=error.message}}
}
function sections(){
 $('panel').innerHTML=`<div class="grid"><form class="card" id="section"><h2>Secciones</h2><p>${T.sections.map(h).join(' · ')}</p>${field('Nombre de sección','name')}<button>Crear sección</button></form><form class="card" id="roster"><h2>Inscribir estudiante</h2>${field('Identificación escolar','id')}${field('Nombre completo','name')}${select('Sección','section',T.sections,'11-4')}<button>Inscribir y generar clave</button></form></div><form class="card" id="importRoster"><h2>Importar nómina privada</h2>${select('Sección','section',T.sections,'11-4')}<label>Archivo JSON descargado por separado<input id="rosterFile" type="file" accept=".json,application/json" required></label><button>Importar nómina</button></form><div class="card"><h2>Lista de estudiantes</h2><div class="scroll"><table><tr><th>Nombre</th><th>Identificación</th><th>Sección</th><th>Clave individual</th></tr>${T.roster.map(s=>`<tr><td>${h(s.name)}</td><td>${h(s.id)}</td><td>${h(s.section)}</td><td><button data-action="reset" data-id="${h(s.id)}">${s.has_pin?'Restablecer clave':'Generar clave'}</button></td></tr>`).join('')}</table></div></div>`;
 binder({reset:async b=>{const s=T.roster.find(x=>x.id===b.dataset.id);if(s.has_pin&&!window.confirm('¿Restablecer la clave de '+s.name+'? La clave anterior dejará de funcionar.'))return;const x=await api('reset-pin',{id:s.id});say('Clave individual de '+s.name+': '+x.pin+'. Compartila únicamente con el estudiante.');await load()}},$('panel'));
 form('importRoster',async p=>{const file=$('rosterFile').files[0];if(file.size>100000)throw Error('La nómina supera el tamaño permitido.');const roster=JSON.parse(await file.text());const r=await api('import-roster',{section:p.section,roster});say(r.imported+' estudiantes nuevos registrados.');await load()});
 form('section',async p=>{await api('section',p);say('Sección creada.');await load()});form('roster',async p=>{const x=await api('roster',p);say('Clave individual de '+p.name+': '+x.pin+'. Compartilo únicamente con el estudiante.');await load()})
}
function prepare(){
 draft=draft||{...T.draft,ids:[...T.draft.ids]};
 const bank=new Map(T.bank.map(q=>[q.id,q]));
 const selected=draft.ids.map(id=>bank.get(id));
 const pending=q=>!q||!q.approved||!q.result||!q.key||!q.options[q.key]||!q.indicator||!q.area||!q.topic;
 const coverage=new Map();
 selected.forEach((q,i)=>{const title=q?.result||'Sin objetivo asignado';if(!coverage.has(title))coverage.set(title,[]);coverage.get(title).push(i+1)});
 const complete=selected.length===60&&selected.every(q=>!pending(q));
 $('panel').innerHTML=`<form id="setup" class="card"><h2>Preparar versión</h2><p>60 preguntas distintas · 1 punto por pregunta</p><div class="grid">${field('Nombre de la versión','title',draft.title)}${select('Sección','section',T.sections,draft.section)}${field('Porcentaje de referencia para refuerzo','support',draft.support,'number')}</div>
 <h3>Cobertura por objetivo evaluado</h3><div class="scroll"><table><thead><tr><th>Objetivo evaluado</th><th>Números de pregunta</th><th>Cantidad</th></tr></thead><tbody>${[...coverage].map(([title,ns])=>`<tr><td>${h(title)}</td><td>${ns.join(', ')}</td><td>${ns.length}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><td></td><th>${selected.length} de 60</th></tr></tfoot></table></div>
 <p>${selected.filter(pending).length} pendientes de clave, objetivo o aprobación.</p>
 <label><input type="checkbox" name="confirmed" required>Revisé las claves y los objetivos de esta versión.</label><div class="bar">${btn('Guardar borrador','save')}${btn('Restaurar orden de 2026','original')}<button class="primary" ${complete?'':'disabled'}>Publicar versión</button></div></form>
 <div class="card"><h2>Preguntas de la versión</h2><div class="scroll"><table><thead><tr><th>Posición</th><th>Procedencia y tema</th><th>Objetivo evaluado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${selected.map((q,i)=>`<tr><td>${i+1}</td><td>${h(src(q))}<br>${h(q.topic)}</td><td>${h(q.result)}</td><td>${pending(q)?'Pendiente':q.flags.length?'Revisar observación':'Disponible'}${q.flags.length?`<p class="small">${h(q.flags.join(' · '))}</p>`:''}</td><td><div class="bar"><button data-action="review" data-i="${i}">Revisar</button><button data-action="replace" data-i="${i}">Sustituir</button></div></td></tr>`).join('')}</tbody></table></div></div>`;
 function capture(){const p=fd($('setup'));draft={...draft,title:p.title,section:p.section,support:Number(p.support)};return p}
 const persist=async()=>{capture();await api('draft',draft)};
 binder({save:async()=>{await persist();say('Borrador guardado.')},original:()=>{capture();draft.ids=Array.from({length:60},(_,i)=>'2-'+(i+1));prepare()},review:async b=>{await persist();review(selected[b.dataset.i])},replace:b=>{
 capture();const i=+b.dataset.i,candidates=T.bank.filter(q=>!draft.ids.includes(q.id));
 show(`<h2>Sustituir pregunta ${i+1}</h2><label>Buscar en el banco<input id="replaceSearch" placeholder="Año, número, tema o modalidad"></label><div id="candidates" class="scroll"></div>`);
 const draw=()=>{const terms=$('replaceSearch').value.toLowerCase().trim().split(/\s+/);
 $ ('candidates').innerHTML=candidates.filter(q=>terms.every(w=>(src(q)+' '+q.stem+' '+q.topic).toLowerCase().includes(w))).map(q=>`<p><strong>${h(src(q))}</strong> · ${pending(q)?'Pendiente':'Disponible'}<br>${h(q.stem.slice(0,130))}<br><button data-action="choose" data-id="${q.id}">Usar en esta posición</button></p>`).join('')||'<p>Sin coincidencias.</p>';
 binder({choose:async b=>{draft.ids[i]=b.dataset.id;await api('draft',draft);modal.close();prepare()}},$('candidates'))};
 $('replaceSearch').oninput=draw;draw()
 }},$('panel'));
 form('setup',async()=>{const p=capture();const x=await api('publish',{...draft,confirmed:!!p.confirmed});exam=x.code;tab='Aplicación';say('Versión publicada. El estudiantado puede ingresar con identificación y clave individual.');await load()})
}
function examSelect(){return select('Evaluación','exam',['',...T.exams.map(e=>e.code+' · '+e.title)],T.exams.find(e=>e.code===exam)?exam+' · '+T.exams.find(e=>e.code===exam).title:'')}
function applications(){
 $('panel').innerHTML=`<div class="card"><h2>Aplicación</h2><div id="picker">${examSelect()}</div><div id="status"></div></div>`;
 const draw=guard(async()=>{if(!exam){$('status').textContent='Elegí una evaluación.';return}const r=await api('results?code='+exam);const e=r.evaluation;
 $('status').innerHTML=`<p>Versión publicada · Sección ${h(e.section)}</p><div class="bar">${btn('Actualizar','refresh')}${btn(e.results?'Ocultar puntaje y retroalimentación':'Publicar puntaje y retroalimentación','release')}${btn('Abrir resultados','results')}</div><table><tr><th>Estudiante</th><th>Estado</th></tr>${r.members.map(m=>`<tr><td>${h(m.name)}</td><td>${h(m.status)}</td></tr>`).join('')}</table>`;
 binder({refresh:draw,release:async()=>{await api('release',{code:exam,results:!e.results});await draw()},results:()=>{tab='Resultados';renderTeacher()}},$('status'))});
 $('picker').onchange=e=>{exam=e.target.value.split(' · ')[0];draw()};draw()
}
function results(){
 $('panel').innerHTML=`<div class="card"><h2>Resultados por objetivo evaluado</h2><div id="picker" class="no-print">${examSelect()}</div><form id="filters" class="no-print"></form><div id="matrix"></div></div>`;
 const fmt=v=>v===null?'Sin entregas':new Intl.NumberFormat('es-CR',{maximumFractionDigits:2}).format(v)+' %';
 const rows=(headers,content)=>`<div class="scroll"><table><thead><tr>${headers.map(x=>`<th scope="col">${h(x)}</th>`).join('')}</tr></thead><tbody>${content}</tbody></table></div>`;
 const tr=cells=>`<tr>${cells.map(x=>`<td>${x}</td>`).join('')}</tr>`;
 const start=guard(async()=>{if(!exam){$('matrix').textContent='Elegí una evaluación.';$('filters').innerHTML='';return}const e=T.exams.find(x=>x.code===exam);
 $('filters').innerHTML=`<label>Vista<select name="student"><option value="">Por sección</option>${e.roster.map(s=>`<option value="${h(s.id)}">Por estudiante · ${h(s.name)}</option>`).join('')}</select></label>`;
 $('filters').onchange=guard(draw);await draw()});
 async function draw(){
 const query=new URLSearchParams({...fd($('filters')),code:exam}),r=await api('results?'+query),individual=!!query.get('student');
 const delivered=r.members.filter(m=>m.status==='Entregó'),inProgress=r.members.filter(m=>m.status==='En proceso').length;
 const bars=[...r.group].filter(x=>x.percent!==null).sort((a,b)=>a.percent-b.percent);
 const label=`<h3>${h(r.evaluation.title)} · ${h(r.evaluation.section)}</h3><div class="bar no-print"><a class="button" href="/api/excel?${query}">Exportar Excel</a>${btn('Imprimir / guardar PDF','print')}</div>`;
 const m=r.members[0];
 const individualReport=m?`<h3>${h(m.name)}</h3><p>${h(m.status)}${m.score===null?'':` · <strong>${m.score}/60 puntos</strong> · Nota ${fmt(m.grade)} sobre 100`}</p>`+(m.score===null?'':rows(['Objetivo evaluado','Preguntas','Aciertos','Errores','Omisiones','Logro','Evidencia'],r.indicators.map((i,j)=>{const v=m.values[i];return tr([h(i),v.total,v.ok,v.errors,v.omitted,fmt(v.percent),`<button data-action="cell" data-j="${j}" data-k="0">Ver respuestas</button>`])}).join(''))):'';
 const groupReport=`<p><strong>${r.members.length}</strong> registrados · <strong>${inProgress}</strong> en proceso · <strong>${delivered.length}</strong> entregaron · <strong>${r.members.length-inProgress-delivered.length}</strong> sin iniciar</p>
 <form id="threshold" class="bar no-print">${field('Porcentaje de referencia para refuerzo','support',r.evaluation.support,'number')}<button>Guardar referencia</button></form>
 <h3>Logro grupal por objetivo</h3>${bars.length?`<div class="chart">${bars.map(g=>`<div class="objective-bar"><button type="button" data-action="group" data-j="${r.indicators.indexOf(g.objective)}">${h(g.objective)}</button><meter min="0" max="100" value="${g.percent}" aria-label="${h(g.objective)}"></meter><span>${fmt(g.percent)} · ${g.questions} ${g.questions===1?'pregunta':'preguntas'}</span></div>`).join('')}</div>`:'<p>Sin entregas para calcular porcentajes.</p>'}
 ${rows(['Objetivo evaluado','Preguntas','Entregaron','Aciertos','Errores','Omisiones','Logro grupal'],r.group.map(g=>tr([h(g.objective),g.questions,g.delivered,g.ok,g.errors,g.omitted,g.total?`${g.ok} de ${g.total} · ${fmt(g.percent)}`:'Sin entregas'])).join(''))}
 <div class="no-print"><h3>Matriz de estudiantes y objetivos</h3>${rows(['Estudiante','Estado','Puntos',...r.indicators],r.members.map((m,k)=>tr([h(m.name),h(m.status),m.score===null?'—':m.score+'/60',...r.indicators.map((i,j)=>{const v=m.values[i];return v?`<button data-action="cell" data-j="${j}" data-k="${k}">${v.ok}/${v.total} · ${fmt(v.percent)}</button>`:'Pendiente'})])).join(''))}</div>`;
 $('matrix').innerHTML=label+(individual?individualReport:groupReport);
 if(!individual)form('threshold',async p=>{await api('support',{code:exam,support:Number(p.support)});await draw()});
 binder({print:()=>window.print(),cell:b=>{const i=r.indicators[b.dataset.j],m=r.members[b.dataset.k],v=m.values[i];show(`<h2>${h(m.name)}</h2><p>${h(i)} · ${v.ok}/${v.total} · ${fmt(v.percent)}</p>${v.evidence.map(q=>`<article class="card"><strong>Pregunta ${q.position} · ${h(src(q))}</strong><p class="pre">${h(q.stem)}</p>${q.visual?`<img src="${h(q.visual)}" alt="Código original de la pregunta ${q.position}">`:''}<p>Respuesta: ${q.chosen?h(q.options[q.chosen]):'Omitida'}</p><p>Clave de la versión: ${h(q.options[q.key])}</p></article>`).join('')}`)},group:b=>{
 const i=r.indicators[b.dataset.j], needs=delivered.filter(m=>m.values[i]?.percent<r.evaluation.support);
 const questions=r.evaluation.items.filter(q=>q.result===i).map(q=>{
 let ok=0,errors=0,omitted=0;const freq=new Map();
 for(const m of delivered){const answer=m.values[i].evidence.find(x=>x.id===q.id).chosen;if(!answer)omitted++;else if(answer===q.key)ok++;else{errors++;const text=q.options[answer];freq.set(text,(freq.get(text)||0)+1)}}
 const max=Math.max(0,...freq.values());
 return {q,ok,errors,omitted,common:[...freq].filter(([,n])=>n===max).map(([text,n])=>`${text} (${n})`).join(' · ')};
 }).sort((a,b)=>a.ok-b.ok||b.errors-a.errors||a.q.position-b.q.position);
 show(`<h2>Refuerzo por objetivo</h2><p>${h(i)}</p><p>${needs.length} estudiantes por debajo de ${fmt(r.evaluation.support)}.</p><ul>${needs.map(m=>`<li>${h(m.name)} · ${fmt(m.values[i].percent)}</li>`).join('')}</ul><h3>Preguntas con menos aciertos</h3>${rows(['Pregunta','Tema','Aciertos','Errores','Omisiones','Opción incorrecta más frecuente'],questions.map(({q,ok,errors,omitted,common})=>tr([q.position,h(q.topic),ok,errors,omitted,h(common||'Sin selecciones incorrectas')])).join(''))}`)
 }},$('matrix'))}
 $('picker').onchange=e=>{exam=e.target.value.split(' · ')[0];start()};start()
}
function renderStudent(){
 clearInterval(timer);
 const a=S.attempt, base=`<p class="label">Sección ${h(S.section)}</p><h1>${h(S.title)}</h1><p>${h(S.name)}</p>`;
 if(!a){view.innerHTML=examCover(S.title,S.count,S.duration)+`<div class="card"><h2>Confirmá tus datos</h2><p><strong>${h(S.name)}</strong> · Sección ${h(S.section)}</p><p>Elegí una opción por pregunta. Tus respuestas se guardan automáticamente y podés retomar el intento con tus datos de ingreso.${S.duration?' El tiempo empieza al confirmar.':''}</p>${btn('Confirmar e iniciar','start',true)}</div>`;binder({start:async()=>{S=await api('start',{});renderStudent()}});return}
 if(a.delivered){view.innerHTML=base+`<div class="card"><h2>Entrega registrada</h2><p>Comprobante <strong>${h(a.receipt)}</strong></p><p>${new Date(a.delivered*1000).toLocaleString('es-CR',{timeZone:'America/Costa_Rica'})}</p>${S.results?`<h3>Retroalimentación</h3><p>${S.score}/60 puntos · Nota ${Number(S.grade.toFixed(2))} sobre 100</p>${Object.entries(S.results).map(([k,v])=>`<details><summary>${h(k)} · ${v.ok} de ${v.total} · ${v.percent.toFixed(1)} %</summary><p>${v.errors} errores · ${v.omitted} omisiones${v.limited?' · Evidencia limitada':''}</p>${v.evidence.map(q=>`<p>${h(q.stem)}<br>Tu respuesta: ${h(q.options[q.chosen]||'Omitida')}<br>Clave: ${h(q.options[q.key])}<br>${h(q.why)}</p>`).join('')}</details>`).join('')}`:'<p>La docente indicará cuándo podés consultar el puntaje y la retroalimentación.</p>'}</div>`;return}
 const answers=JSON.parse(a.answers),marks=JSON.parse(a.marks),q=S.items[position],remaining=S.count-Object.keys(answers).length;
 view.innerHTML=base+`<div class="card"><p id="time" role="timer" aria-live="off"></p><label for="progress">${S.count-remaining} de ${S.count} preguntas contestadas</label><progress id="progress" max="${S.count}" value="${S.count-remaining}"></progress><nav class="bar" aria-label="Preguntas">${S.items.map((x,i)=>`<button data-action="jump" data-i="${i}" aria-current="${i===position}" aria-label="Pregunta ${i+1}${marks.includes(x.id)?', marcada':''}${answers[x.id]?', contestada':''}">${i+1}${marks.includes(x.id)?' *':''}</button>`).join('')}</nav>${verify?`<h2>Confirmá la entrega</h2><p>${remaining} preguntas sin contestar.</p><div class="bar">${btn('Regresar a la prueba','back')}${remaining?btn('Ir a la primera omisión','missing'):''}${btn('Entregar definitivamente','submit',true)}</div>`:`<h2 tabindex="-1">Pregunta ${position+1} de ${S.count}</h2><div class="pre">${h(q.stem).replace('[Fragmento del examen]',q.visual?`<img src="${h(q.visual)}" alt="Fragmento de código original de la pregunta ${position+1}">`:'')}</div><fieldset><legend>Seleccioná una opción</legend>${(q.option_order||Object.keys(q.options)).map((id,i)=>`<label class="choice"><input type="radio" name="answer" value="${h(id)}" ${answers[q.id]===id?'checked':''}>${String.fromCharCode(65+i)}. ${h(q.options[id])}</label>`).join('')}</fieldset><div class="bar">${btn(marks.includes(q.id)?'Quitar marca':'Marcar para revisar','mark')}${position?btn('Anterior','prev'):''}${position<S.count-1?btn('Siguiente','next',true):''}${btn('Revisar entrega','check')}</div>`}</div>`;
 function store(payload,update){save=save.catch(()=>{}).then(()=>api('answer',{id:q.id,...payload})).then(async result=>{if(result.expired){S=await api('student');say('Se agotó el tiempo.');renderStudent();return}update();say('Cambios guardados.');renderStudent()});return save}
 view.querySelectorAll('input[name=answer]').forEach(x=>x.onchange=guard(()=>store({answer:x.value},()=>{const fresh=JSON.parse(a.answers);fresh[q.id]=x.value;a.answers=JSON.stringify(fresh)}).then(()=>view.querySelector('input[name=answer]:checked')?.focus())));
 const nav=async fn=>{await save;fn();say();renderStudent();view.querySelector('h2')?.focus()};
 binder({jump:b=>nav(()=>{verify=false;position=+b.dataset.i}),prev:()=>nav(()=>position--),next:()=>nav(()=>position++),check:()=>nav(()=>verify=true),back:()=>nav(()=>verify=false),missing:()=>nav(()=>{position=S.items.findIndex(x=>!answers[x.id]);verify=false}),mark:()=>store({mark:!marks.includes(q.id)},()=>a.marks=JSON.stringify(marks.includes(q.id)?marks.filter(i=>i!==q.id):[...marks,q.id])),submit:async()=>{await save;S=await api('submit',{});say();renderStudent()}});
 if(S.deadline){
  const tick=guard(async()=>{
   const elapsed=(performance.now()-S.clockSample)/1000;
   const secs=Math.max(0,Math.ceil(S.deadline-S.server_now-elapsed));
   const clock=[Math.floor(secs/3600),Math.floor(secs/60)%60,secs%60].map(n=>String(n).padStart(2,'0')).join(':');
   $('time').textContent='Tiempo restante · '+clock;
   if(!secs){clearInterval(timer);await save.catch(()=>{});S=await api('student');renderStudent()}
  });
  timer=setInterval(tick,250);tick()
 }
}
guard(boot)();
</script>
</html>
